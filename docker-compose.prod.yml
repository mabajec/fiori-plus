# Production compose: Postgres + the Fiori web app on a single host.
#
# Usage:
#   cp .env.prod.example .env.prod   # then edit secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec app alembic upgrade head
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec app fiori init
#
# The app is served by the host's Traefik reverse proxy (Docker provider,
# shared external network "web") at https://${APP_HOST} with an automatic
# Let's Encrypt certificate — see DEPLOY.md. Port ${APP_PORT} (default 8000)
# is additionally bound on ${APP_BIND} (default 127.0.0.1) for local checks
# only; the host firewall drops it from the internet anyway.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fiori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-fiori}
    # No host port mapping — db is only reachable from the app container.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fiori} -d ${POSTGRES_DB:-fiori}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fiori}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fiori}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env.prod}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      INPUTS_DIR: /app/inputs
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@local}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Admin}
    ports:
      # Loopback only — the public route is the Traefik router below.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    networks:
      - default
      - web
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.services.fiori-plus.loadbalancer.server.port: "8000"
      # Plain HTTP: only used for the ACME challenge and to bounce to HTTPS.
      traefik.http.routers.fiori-plus.entrypoints: http
      traefik.http.routers.fiori-plus.rule: Host(`${APP_HOST:?set APP_HOST in .env.prod}`)
      traefik.http.routers.fiori-plus.middlewares: fiori-plus-https
      traefik.http.middlewares.fiori-plus-https.redirectscheme.scheme: https
      traefik.http.middlewares.fiori-plus-https.redirectscheme.permanent: "true"
      traefik.http.routers.fiori-plus-secure.entrypoints: https
      traefik.http.routers.fiori-plus-secure.rule: Host(`${APP_HOST}`)
      traefik.http.routers.fiori-plus-secure.tls: "true"
      traefik.http.routers.fiori-plus-secure.tls.certresolver: http
    volumes:
      # TSV exports go here. Per-user subfolders are created on demand by
      # the app, and the /imports upload endpoint writes to them — so this
      # mount must be read-write. Override the host path with
      # HOST_INPUTS_DIR in .env.prod if you want a different location.
      - ${HOST_INPUTS_DIR:-./inputs}:/app/inputs

networks:
  # Created and owned by the Traefik deployment (/opt/truebar/traefik).
  web:
    external: true

volumes:
  db_data:
